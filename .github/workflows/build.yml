name: Build RBF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose checked-out tree
        run: |
          echo "--- top-level files ---"
          ls -la
          echo "--- .qsf TOP_LEVEL / DEVICE / FAMILY / FLOW assignments ---"
          grep -iE "TOP_LEVEL_ENTITY|^set_global_assignment -name DEVICE|^set_global_assignment -name FAMILY|FLOW_ENABLE|PROJECT_OUTPUT_DIRECTORY" Arcade-SegaSystem32Multi.qsf || true
          echo "--- .qpf content ---"
          cat Arcade-SegaSystem32Multi.qpf
          echo "--- rtl tree size ---"
          du -sh rtl 2>/dev/null || echo "rtl/ non trovata"

      - name: Compile with Quartus (inside Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            bash -c '
              QSH=$(find / -iname "quartus_sh" 2>/dev/null | grep -v uninstall | head -n1)
              QDIR=$(dirname "$QSH")
              echo "Trovato in: $QSH"
              export LD_LIBRARY_PATH="$QDIR:$LD_LIBRARY_PATH"
              rm -f "$QDIR/libboost_system.so"
              "$QSH" --flow compile Arcade-SegaSystem32Multi.qpf
              QEXIT=$?
              echo "### QUARTUS_SH EXIT CODE: $QEXIT ###"
              echo "--- contenuto cartella di lavoro dopo compile ---"
              ls -la
              echo "--- output_files dopo compile ---"
              ls -la output_files/ 2>&1 || echo "output_files ASSENTE"
            '

      - name: Upload RBF
        uses: actions/upload-artifact@v4
        with:
          name: rbf-compilato
          path: output_files/*.rbf
