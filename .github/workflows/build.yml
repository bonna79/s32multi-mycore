name: Build RBF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose checked-out tree
        run: |
          echo "--- top-level files ---"
          ls -la
          echo "--- .qsf source file assignments ---"
          grep -iE "SOURCE_FILE|VERILOG_FILE|SYSTEMVERILOG_FILE|QIP_FILE" Arcade-SegaSystem32Multi.qsf || true
          echo "--- rtl tree size ---"
          du -sh rtl 2>/dev/null || echo "rtl/ non trovata"
          echo "--- eventuali LFS pointer ---"
          grep -rl "git-lfs.github.com" . --include="*.sv" --include="*.v" 2>/dev/null || echo "nessun pointer LFS trovato"

      - name: Compile with Quartus (inside Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            bash -c '
              QSH=$(find / -iname "quartus_sh" 2>/dev/null | grep -v uninstall | head -n1)
              echo "Trovato in: $QSH"
              export LD_LIBRARY_PATH="$(dirname "$QSH"):$LD_LIBRARY_PATH"
              "$QSH" --flow compile Arcade-SegaSystem32Multi.qpf
            '

      - name: Upload RBF
        uses: actions/upload-artifact@v4
        with:
          name: rbf-compilato
          path: output_files/*.rbf
